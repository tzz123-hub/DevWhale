<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#g)"/>
  <!-- Whale silhouette -->
  <g transform="translate(100,100)" fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="55" ry="35"/>
    <!-- Tail -->
    <path d="M-55,5 L-80,-15 L-75,5 L-80,25 Z" fill="white" stroke="none"/>
    <!-- Eye -->
    <circle cx="25" cy="-8" r="5" fill="white" stroke="none"/>
    <!-- Smile -->
    <path d="M15,15 Q30,30 45,15" stroke-width="3"/>
    <!-- Water spout -->
    <path d="M40,-20 Q45,-45 50,-20" stroke-width="2"/>
    <path d="M35,-15 Q38,-35 42,-15" stroke-width="2"/>
    <path d="M45,-15 Q48,-38 52,-15" stroke-width="2"/>
  </g>
  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="24" fill="white">DevWhale</text>
</svg>
